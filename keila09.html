    <header>
        <form id="form">
        <img src="klogo.png" alt="logo" style="width: 40px; height: 40px;">
        <input type="text" id="search" class="search" placeholder="Busca tu personaje"></form>

    <main id="main"></main>

    <script>
        const API_URL_HP = 'https://hp-api.onrender.com/api/characters';
        const API_URL_RM = 'https://rickandmortyapi.com/api/character';
        
        const main = document.getElementById('main');
        const form = document.getElementById('form');
        const search = document.getElementById('search');

        //Carga inicial de todas las APIs
        getAllCharacters();
        //Se llama a la función que obtiene todos los personajes de ambas APIs cuando la página carga por primera vez
        async function getAllCharacters(){
            const [resRM, resHP] = await Promise.all([
                fetch(API_URL_RM).then(res => res.json()),
                fetch(API_URL_HP).then(res => res.json())
            ]);

            //La función es async, porque va a usar await
            //Se muestra un mensaje mientras cargan los personajes
            //Se hacen ambas peticiones en paralelo con Promise.all
            //Se convierten las respuestas en formato JSON
            //await hace que JavaScript espere el resultado de Promise.all(..)antes de continuar con el resto del códig, 
            // Es decir, detiene la ejecución hasta que ambas respuestas esten listas

            const rm = resRM.results || [];
            const hp = resHP || [];

            //se guardan los arrays de los personajes 
            //Rick and Morty usa results, Harry Potter devuelve un array directamente

            showCharacters([...rm, ...hp]);
        }

        //se llama a showCharacters para mostrar todos los personajes juntos

        function showCharacters(characters){
            main.innerHTML= '';
                
            characters.forEach((char) => {
                let name = char.name || 'Desconocido';
                let image = char.image || '';
                let status = char.status || (char.alive === false ? 'Deceased' : 'Alive');
                let species = char.species || 'Desconocido'; //let race = char.race || char.especies;
                let gender = char.gender || '';

                const charElement = document.createElement('div');
                charElement.classList.add('personaje');

                //aqui se pone let debido a que arriba se usa let, se ponen los elementos que se usan de manera individual, arriba solo estan los que se ponen en ambos 
                //se pone el signo de pregunta y despues el punto ya que viene de ese "subtema"
        if (char.status) {
            let id = char.id;
            let origin = char.origin;
            let location = char.location;
            
            charElement.innerHTML=`
            <img src = "${image}" alt="${image}">
            <div class="personaje-info">
                <h1>${id}</h1>
                <h3>${name}</h3>
                <br>
                ${origin?.name || 'Desconocido'}
            </div>
            <div class = "overview">
                <h3>Descripción</h3>
                <p><strong>Species: </strong> ${species}</p>
                <p><strong>Gender: </strong> ${gender}</p>
                <p><strong>Location: </strong> ${location?.name || 'Desconocido'}</p>
                </div>`;
            } else{
                //aqui si va con const como el cod anterior, si no no funciona
                const{house,patronus, yearOfBirth, ancestry, core} = char;
                charElement.innerHTML=`
                <img src = "${image}" alt="${image}">
                <div class="personaje-info">
                    <h3>${name}</h3>
                    <br>
                    ${house || 'Sin casa'}
                </div>
                <div class = "overview">
                    <h3>Descripción</h3>
                    <p><strong>Species: </strong> ${species}</p>
                    <p><strong>Patronus: </strong> ${patronus || 'No tiene'}</p>
                    <p><strong>Gender: </strong> ${gender}</p>
                    <p><strong>Year of birth: </strong> ${yearOfBirth}</p>
                    <p><strong>Ancestry: </strong> ${ancestry || 'Desconocido'}</p>
                    </div>`;}

                    main.appendChild(charElement);
                        }) }
                        
    </script>
